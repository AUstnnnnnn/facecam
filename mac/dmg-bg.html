<!doctype html>
<!-- Source for dmg-bg.png / dmg-bg@2x.png (640x400 Finder window). Render at 1x and 2x and save both.
     Icons sit at (160, 190) and (480, 190); Finder draws their names below them. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Hanken+Grotesk:wght@500&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
body { width: 640px; height: 400px; overflow: hidden; position: relative; background: #ededef; color: #1b1b1c; font-family: "Hanken Grotesk", sans-serif; }
h1 { position: absolute; top: 34px; left: 0; right: 0; margin: 0; text-align: center; font: 700 27px/1.1 "Bricolage Grotesque", sans-serif; letter-spacing: -.02em; }
h1 span { color: #e8560a; }
p { position: absolute; bottom: 30px; left: 0; right: 0; margin: 0; text-align: center; font-size: 14px; color: #5f5f66; }
/* soft wells the two icons sit in */
.well { position: absolute; top: 120px; width: 140px; height: 140px; border-radius: 34px; background: #e0e0e3; box-shadow: inset 0 2px 6px rgba(0,0,0,.07); }
.l { left: 90px; } .r { left: 410px; }
svg { position: absolute; left: 248px; top: 160px; }
</style></head>
<body>
  <h1>Drag <span>Facecam</span> into Applications</h1>
  <div class="well l"></div><div class="well r"></div>
  <svg width="144" height="60" viewBox="0 0 144 60" fill="none" stroke="#ff6a1a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 38 C 44 8, 96 8, 128 32"/>
    <path d="M110 31.4 L128 32 L122.4 14.9"/>
  </svg>
  <p>Then open Facecam from your Applications folder.</p>
</body></html>
